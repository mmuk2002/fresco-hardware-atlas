[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fresco-hardware-sets"
version = "0.1.0"
description = "Evidence-backed extraction and human review of construction hardware sets"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = [
  "PyMuPDF==1.28.2",
  "pydantic==2.13.5",
  "fastapi==0.141.1",
  "uvicorn==0.53.0",
  "python-multipart==0.0.32",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "httpx==0.28.1", "playwright==1.63.0"]

[project.scripts]
hardware-sets = "hardware_sets.cli:main"

[tool.setuptools.packages.find]
include = ["hardware_sets*"]

[tool.setuptools.package-data]
hardware_sets = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
